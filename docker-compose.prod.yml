# ==============================================================================
# Production Docker Compose for Task Manager (Jira Alternative)
# Stack: Nginx (Frontend) + NestJS (API) + Worker (Outbox/Jobs) + PostgreSQL + Redis
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 Relational Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: tm_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-task_manager}
      POSTGRES_USER: ${DATABASE_USER:-dev}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-dev_password}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-dev} -d ${DATABASE_NAME:-task_manager}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tm_network

  # ----------------------------------------------------------------------------
  # 2. Redis 7 Cache & In-memory Store
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tm_prod_redis
    restart: always
    volumes:
      - redisdata_prod:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tm_network

  # ----------------------------------------------------------------------------
  # 3. NestJS Backend REST API Server
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tm_prod_backend
    restart: always
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      APP_PORT: 3001
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-dev}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-dev_password}
      DATABASE_NAME: ${DATABASE_NAME:-task_manager}
      DATABASE_LOGGING: 'false'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-production_jwt_secret_change_me_super_secure_2026}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-production_refresh_secret_change_me_super_secure_2026}
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      RUN_MIGRATIONS: 'true'
      RUN_WORKERS: 'false'
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-noreply@taskmanager.pro}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tm_network

  # ----------------------------------------------------------------------------
  # 4. Background Worker Daemon (Outbox Publisher, Jobs, Automation)
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tm_prod_worker
    restart: always
    command: ['node', 'dist/worker.main.js']
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-dev}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-dev_password}
      DATABASE_NAME: ${DATABASE_NAME:-task_manager}
      DATABASE_LOGGING: 'false'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RUN_WORKERS: 'true'
      RUN_MIGRATIONS: 'false'
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-noreply@taskmanager.pro}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tm_network

  # ----------------------------------------------------------------------------
  # 5. Frontend Single Page Application (Nginx Alpine + Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: tm_prod_frontend
    restart: always
    ports:
      - '80:80'
      - '3000:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tm_network

volumes:
  pgdata_prod:
    driver: local
  redisdata_prod:
    driver: local

networks:
  tm_network:
    driver: bridge
